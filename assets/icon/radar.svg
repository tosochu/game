
<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#fefe86" stroke-width="1.5">
    <!-- 蜘蛛网圆形框架 -->
    <rect x="120" y="250" width="60" height="30" rx="5" fill="#555" stroke="#333" stroke-width="2"/>
    <rect x="130" y="240" width="40" height="10" fill="#666"/>
    
    <!-- 雷达支架 -->
    <path d="M145 240 L145 200 L155 200 L155 240" fill="#777"/>
    
    <!-- 雷达主体 -->
    <circle cx="150" cy="150" r="100" fill="#0a2f35" stroke="#00ff88" stroke-width="2"/>
    
    <!-- 同心圆刻度 -->
    <circle cx="150" cy="150" r="80" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>
    <circle cx="150" cy="150" r="60" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>
    <circle cx="150" cy="150" r="40" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>
    <circle cx="150" cy="150" r="20" fill="none" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>
    
    <!-- 十字准线 -->
    <line x1="150" y1="50" x2="150" y2="250" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>
    <line x1="50" y1="150" x2="250" y2="150" stroke="#00cc66" stroke-width="1" stroke-dasharray="5,5"/>

    <!-- 扫描区域 -->
    <path class="scan-line" d="M150 150 L150 50 A100 100 0 0 1 250 150 Z" fill="url(#scanGradient)"/>
    
    <line class="scan-line" x1="150" y1="150" x2="150" y2="50" stroke="#00ff88" stroke-width="2"/>
    
    <circle class="signal" cx="180" cy="120" r="5" fill="#ff4444"/>
    <circle class="signal" cx="120" cy="180" r="5" fill="#ff4444"/>
    <circle class="signal" cx="200" cy="200" r="5" fill="#ff4444"/>
    
    <circle cx="150" cy="150" r="5" fill="#00ff88"/>
  </g>
</svg>

